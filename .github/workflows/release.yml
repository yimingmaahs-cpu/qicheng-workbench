name: Windows release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$version") { throw 'Tag and package version must match' }
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run package
      - name: Publish tested package
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" releases/Qicheng-Windows-x64.zip --verify-tag --generate-notes --title "启程 $env:GITHUB_REF_NAME"

